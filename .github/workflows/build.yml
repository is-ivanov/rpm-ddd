# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Despite the filename, this is the whole per-PR/main CI pipeline: backend Maven
# build + frontend vitest build + Playwright e2e + unified Allure report + Pages
# deploy — not "just Java". deploy.yml's `workflow_run.workflows` references this
# `name:`; keep the two in sync (renaming here without deploy.yml silently stops deploys).
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "frontend/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "Dockerfile"
      - ".github/workflows/build.yml"
      - ".github/path-filters.yml"
      - "code-quality-config/**"
      - "package.json"
      - "package-lock.json"
      - "allurerc.mjs"
  # Deliberately NO `paths:` filter on pull_request. A workflow skipped by path
  # filtering never reports its checks, so the `build` context required by the
  # `main` ruleset would stay Pending forever and block the PR (#296). Every job
  # instead evaluates .github/path-filters.yml itself and gates its own expensive
  # steps, so `build` always reports a *real* conclusion — not the `skipped` one a
  # job-level `if:` would give, which branch protection counts as success and which
  # would therefore make the gate fail open. See
  # ProductSpecification/tasks/296-bug-ci-required-checks-pending/spec.md.
  pull_request:
    branches: ["main"]

# Least privilege by default: checkout needs contents, and dorny/paths-filter reads
# the PR's changed-file list over the REST API. The elevated pages/id-token scopes
# are granted per-job on deploy-report (the only job that deploys to Pages).
permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run on the same ref so a new push doesn't run a full
# build + e2e in parallel with the previous one. main is exempt
# (cancel-in-progress is false there): its run drives the Pages deploy
# (deploy-report) and must not be cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Consumed by allure-report, which must not try to download an artifact this
    # job never produced. Mirrors the step gates below: true on any non-PR run.
    outputs:
      ran: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
    # Shared-first Postgres for DB-tagged tests: DbContainerTestExecutionListener
    # probes localhost:54034 and reuses this service instead of cold-starting a
    # Testcontainer (image pull + ryuk + boot) on every run. Creds/port/db match
    # docker/infra-tests.yml so the listener's "Local db server found" path fires.
    # Each CI run is an isolated ephemeral VM, so this service is per-run private —
    # no cross-PR sharing. Postgres perf flags (fsync=off, …) are not set: GitHub
    # service containers cannot override the container command.
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpm_ddd
        ports:
          - 54034:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v7
    # Skipped on push: the push trigger above already narrows by path, and a
    # skipped step yields empty outputs, so the `event_name != 'pull_request'`
    # arm of every gate below takes over and the job runs in full.
    - name: Detect relevant changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v4
      with:
        filters: .github/path-filters.yml
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # The frontend is built/tested in the parallel `frontend-build` job, so the
    # backend build drops `-Pfrontend` to stay off the critical path. spotless:check
    # (bound to `compile`) and spotbugs:check (bound to `verify`) are skipped here
    # too — both stay bound in pom.xml so a local `./mvnw verify` runs them, but CI
    # enforces each in its own parallel Code Quality job to keep this build off the
    # critical path.
    #
    # On main only, the deploy artifact (`app-jar`, consumed by deploy.yml) must
    # carry the bundled SPA, so re-enable `-Pfrontend` to run copy-frontend-dist —
    # but skip vitest (`-Dnpm.test.skip=true`), which already runs in frontend-build.
    - name: Build with Maven (PR — backend only)
      if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || steps.filter.outputs.build == 'true')
      run: mvn verify -B -Dspotless.check.skip=true -Dspotbugs.skip=true
    # main-only, so the change filter never applies: a pull_request run cannot have
    # github.ref == refs/heads/main.
    - name: Build with Maven (main — bundle SPA into deploy jar, vitest runs in frontend-build)
      if: github.ref == 'refs/heads/main'
      run: mvn verify -B -Pfrontend -Dspotless.check.skip=true -Dspotbugs.skip=true -Dnpm.test.skip=true

    # Report generation moved to the `allure-report` job so backend + vitest
    # results (here) can be merged with Playwright results from `frontend-e2e`.
    - name: Upload Allure results
      if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || steps.filter.outputs.build == 'true')
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-build
        path: target/allure-results
        retention-days: 1

    # Gated on the change filter as well as the actor: fail_ci_if_error turns a
    # missing jacoco.xml into a failure, which on a PR that skipped the Maven run
    # would fail this required check for no reason.
    - name: Upload coverage to Codecov
      if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || steps.filter.outputs.build == 'true')
      uses: codecov/codecov-action@v7
      with:
        files: target/site/jacoco/jacoco.xml
        fail_ci_if_error: true
        # Install the Codecov CLI from PyPI (pip package-hash integrity) instead of
        # downloading it from cli.codecov.io. The cli.codecov.io path verifies the
        # binary via a GPG public key fetched from a keyserver on every run, which is
        # flaky: an empty fetch failed with "gpg: Can't check signature: No public key"
        # and aborted the upload. use_pypi sidesteps that path while keeping a
        # supply-chain integrity guarantee. fail_ci_if_error stays on so genuine
        # upload failures still gate CI.
        use_pypi: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload JAR artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 1

#    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
#    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  # Builds and unit-tests the frontend (vitest) in parallel with `build`, off the
  # backend critical path — this replaces the frontend work the backend Maven run
  # used to do under `-Pfrontend`. Emits Allure results (allure-vitest reporter ->
  # target/allure-results, see vite.config.ts) for the `allure-report` merge. The
  # backend `build` job no longer runs vitest (the main deploy build bundles the
  # SPA but skips vitest via -Dnpm.test.skip=true).
  frontend-build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ran: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7
    - name: Detect relevant changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v4
      with:
        filters: .github/path-filters.yml
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npm ci
    - name: Build frontend
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npm run build
    - name: Run vitest
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npm run test
    - name: Upload frontend Allure results
      if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true')
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-frontend
        path: target/allure-results
        retention-days: 1

  # Runs the Playwright e2e suite in parallel with `build` (no dependency: the
  # frontend-only stack needs neither the app jar nor Postgres). Playwright's
  # webServer config boots vite itself. Emits Allure results, uploaded as an
  # artifact that the `allure-report` job merges into the unified report.
  frontend-e2e:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7
    - name: Detect relevant changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v4
      with:
        filters: .github/path-filters.yml
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npm ci
    - name: Install Playwright browsers
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npx playwright install --with-deps chromium
    - name: Run Playwright e2e
      if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
      run: npm run test:e2e
    - name: Upload e2e Allure results
      if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true')
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-e2e
        path: target/allure-results
        retention-days: 1

  # Merges Allure results from `build` (backend + vitest) and `frontend-e2e`
  # (Playwright) into one unified report. Runs even if upstream tests failed so
  # the report always reflects the latest run.
  #
  # Each upstream job publishes a `ran` output saying whether the change filter let
  # it execute. This job skips when none of them ran, and each download below is
  # gated on its own producer — download-artifact fails hard on a missing artifact,
  # so downloading unconditionally would break the report on partial runs (e.g. a
  # backend-only PR, where the frontend jobs produce nothing).
  allure-report:
    needs: [build, frontend-build, frontend-e2e]
    if: >-
      always() && github.actor != 'dependabot[bot]'
      && (needs.build.outputs.ran == 'true'
          || needs.frontend-build.outputs.ran == 'true'
          || needs.frontend-e2e.outputs.ran == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Download build Allure results
      if: needs.build.outputs.ran == 'true'
      uses: actions/download-artifact@v8
      with:
        name: allure-results-build
        path: target/allure-results
    - name: Download frontend Allure results
      if: needs.frontend-build.outputs.ran == 'true'
      uses: actions/download-artifact@v8
      with:
        name: allure-results-frontend
        path: target/allure-results
    - name: Download e2e Allure results
      if: needs.frontend-e2e.outputs.ran == 'true'
      uses: actions/download-artifact@v8
      with:
        name: allure-results-e2e
        path: target/allure-results
    - name: Generate Allure report
      run: |
        npm ci
        npm run report
    - name: Upload Allure report
      uses: actions/upload-artifact@v7
      with:
        name: allure-report
        path: target/allure-report
        retention-days: 7

  # Publishes the Allure report to GitHub Pages. Runs only on main (incl. manual
  # dispatch) and even if tests failed, so the web report always reflects the latest run.
  deploy-report:
    needs: allure-report
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job deploys to Pages — it alone gets the elevated scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download Allure report
      uses: actions/download-artifact@v8
      with:
        name: allure-report
        path: allure-report
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: allure-report
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
